[project]
name = "thinking-system"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "requests",
    "pandas",
    "numpy",
    "sentence-transformers",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
