[project]
name = "thinking-system"
version = "0.1.0"
# 3.10+, not 3.9: src/benchmark/{reference_fetcher,baseline_loader}.py use PEP
# 604 unions (`dict | None`) directly in annotations with no
# `from __future__ import annotations`, so they are evaluated at
# function-definition time and raise TypeError on 3.9.
requires-python = ">=3.10"
dependencies = [
    "requests",
    "pandas",
    "openai==1.82.0",
    "python-dotenv==1.1.0",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "." puts the repo root on sys.path explicitly, so `project_config` is
# importable by design rather than by a side effect of pytest's default
# `prepend` import mode plus the __init__.py files under tests/.
pythonpath = ["src", "."]
